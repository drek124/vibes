[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibes-client"
version = "0.1.0"
description = "The VIBES Streaming API Wrapper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "drek124", email = "drek.dev124@gmail.com" },
]
keywords = ["vibes", "api", "streaming", "async", "wrapper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Streaming :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx", "websockets",
]

[project.urls]
Homepage = "https://github.com/drek124/vibes-api"
Repository = "https://github.com/drek124/vibes-api"
Issues = "https://github.com/drek124/vibes-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["vibes"]


